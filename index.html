<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Variable Schema Linker</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0d1117; color: #e6edf3; }

  /* Tabs */
  .tabs { display: flex; background: #161b22; border-bottom: 1px solid #30363d; padding: 0 24px; position: sticky; top: 0; z-index: 100; }
  .tab { padding: 12px 24px; font-size: 14px; font-weight: 500; cursor: pointer; border-bottom: 2px solid transparent; color: #7d8590; }
  .tab:hover { color: #e6edf3; }
  .tab.active { color: #e6edf3; border-bottom-color: #f78166; }
  .tab .badge { background: #30363d; color: #7d8590; font-size: 11px; padding: 1px 6px; border-radius: 10px; margin-left: 6px; }
  .tab.active .badge { background: #f78166; color: #fff; }

  /* Toolbar */
  .toolbar { display: flex; align-items: center; gap: 12px; padding: 12px 24px; background: #0d1117; border-bottom: 1px solid #21262d; position: sticky; top: 45px; z-index: 99; }
  .toolbar button { background: #238636; color: #fff; border: none; padding: 6px 16px; border-radius: 6px; font-size: 13px; cursor: pointer; font-weight: 500; }
  .toolbar button:hover { background: #2ea043; }
  .toolbar button.secondary { background: #21262d; color: #c9d1d9; border: 1px solid #30363d; }
  .toolbar button.secondary:hover { background: #30363d; }
  .toolbar button.danger { background: #da3633; }
  .toolbar button.danger:hover { background: #f85149; }
  .toolbar .stats { font-size: 12px; color: #7d8590; margin-left: auto; }
  .toolbar .stats b { color: #e6edf3; }

  /* Layer content */
  .layer { display: none; padding: 24px; flex-direction: column; gap: 0; position: relative; }
  .layer.active { display: flex; }
  .layer .link-svg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }
  .layer .link-svg line { stroke: #3fb95066; stroke-width: 1.5; }
  .layer .link-svg circle { fill: #3fb950; }
  .var-item.dim { display: none; }
  #layer0 .var-item.dim { display: flex; visibility: hidden; }

  .layer-headers { display: flex; gap: 24px; margin-bottom: 0; position: sticky; top: 105px; z-index: 50; }
  .side-header { flex: 1; font-size: 14px; font-weight: 600; padding: 10px 16px; border-radius: 8px 8px 0 0; border: 1px solid #30363d; border-bottom: none; }
  .side-header.old { background: #3d1f00; color: #f0883e; }
  .side-header.new { background: #0d2818; color: #3fb950; }
  .side-header span { font-weight: 400; color: #7d8590; font-size: 12px; }

  /* Group pairs — each row has old + new aligned at top */
  .group-pair { display: flex; gap: 24px; margin-bottom: 16px; align-items: flex-start; }
  .group-pair .group-box { flex: 1; min-width: 0; border: 1px solid #30363d; border-radius: 8px; overflow: hidden; }
  .group-pair .group-box.empty { border-style: dashed; border-color: #21262d; display: flex; align-items: center; justify-content: center; min-height: 48px; color: #30363d; font-size: 12px; font-style: italic; }

  /* Groups */
  .group-title { padding: 8px 12px; background: #161b22; border-bottom: 1px solid #21262d; font-size: 13px; font-weight: 600; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
  .group-title:hover { background: #1c2128; }
  .group-title .cnt { font-size: 11px; color: #7d8590; font-weight: 400; }
  .group-title .arrow { transition: transform 0.15s; }
  .group-title.collapsed .arrow { transform: rotate(-90deg); }
  .group-body { }
  .group-body.hidden { display: none; }

  /* Variable items */
  .var-item { padding: 5px 12px; font-size: 12px; cursor: pointer; display: flex; align-items: center; gap: 8px; border-left: 3px solid transparent; transition: all 0.1s; }
  body.readonly .var-item { cursor: default; }
  .var-item:hover { background: #161b22; }
  .var-item.selected { background: #1c3a5f; border-left-color: #58a6ff; }
  .var-item.linked { border-left-color: #3fb950; background: #0d2818; }
  .var-item.linked.last-linked { outline: 2px solid #58a6ff; outline-offset: -2px; border-left-color: #58a6ff; background: #1c3a5f; }
  .var-item.linked:hover { background: #1a4d2e; }
  .readonly-badge { color: #8b949e; font-size: 12px; padding: 4px 8px; border: 1px solid #30363d; border-radius: 4px; display: none; }
  body.readonly .readonly-badge { display: inline-block; }
  .var-item .swatch { width: 16px; height: 16px; border-radius: 3px; border: 1px solid #30363d; flex-shrink: 0; position: relative; }
  .var-item .swatch.has-alpha { background-image: linear-gradient(45deg, #333 25%, transparent 25%), linear-gradient(-45deg, #333 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #333 75%), linear-gradient(-45deg, transparent 75%, #333 75%); background-size: 8px 8px; background-position: 0 0, 0 4px, 4px -4px, -4px 0px; }
  .var-item .swatch .swatch-color { position: absolute; inset: 0; border-radius: 2px; }
  .var-item .name { flex: 1; color: #c9d1d9; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .var-item .link-indicator { font-size: 10px; color: #3fb950; white-space: nowrap; max-width: 200px; overflow: hidden; text-overflow: ellipsis; }
  .var-item .auto-dot { color: #7d8590; font-size: 9px; margin-left: 2px; }
  .var-item .alias-info { font-size: 10px; color: #58a6ff; white-space: nowrap; }

  /* Layer 2: two-column layout with SVG lines */
  .layer.two-col { position: relative; }
  .two-col .columns { display: flex; gap: 80px; align-items: flex-start; }
  .two-col .col { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 16px; }
  .two-col .col.sticky { position: sticky; top: 200px; }


  /* Instructions overlay */
  .instructions { text-align: center; padding: 16px; font-size: 12px; color: #7d8590; background: #161b22; border-bottom: 1px solid #21262d; line-height: 1.6; }
  .instructions kbd { background: #21262d; border: 1px solid #30363d; padding: 1px 6px; border-radius: 4px; font-size: 11px; }

  /* Export overlay */
  .export-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 200; align-items: center; justify-content: center; }
  .export-overlay.open { display: flex; }
  .export-box { background: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 24px; width: 700px; max-height: 80vh; display: flex; flex-direction: column; }
  .export-box h3 { font-size: 16px; margin-bottom: 12px; }
  .export-box textarea { flex: 1; min-height: 300px; background: #0d1117; color: #e6edf3; border: 1px solid #30363d; border-radius: 6px; padding: 12px; font-family: 'SF Mono', monospace; font-size: 12px; resize: vertical; }
  .export-box .actions { display: flex; gap: 8px; margin-top: 12px; justify-content: flex-end; }

  /* Search */
  .search-bar { padding: 8px 24px; background: #0d1117; border-bottom: 1px solid #21262d; }
  .search-bar input { width: 100%; background: #161b22; border: 1px solid #30363d; border-radius: 6px; padding: 8px 12px; font-size: 13px; color: #e6edf3; outline: none; }
  .search-bar input:focus { border-color: #58a6ff; }
  .search-bar input::placeholder { color: #484f58; }
  .var-item.search-hidden { display: none; }
</style>
</head>
<body>

<div class="tabs">
  <div class="tab active" onclick="switchTab(0)">Layer 1: Primitives <span class="badge" id="badge0">0</span></div>
  <div class="tab" onclick="switchTab(1)">Layer 2: Semantic <span class="badge" id="badge1">0</span></div>
</div>

<div class="toolbar">
  <button onclick="exportLinks()">📋 Copy Links JSON</button>
  <button class="secondary" onclick="showExport()">👁 View All Links</button>
  <span class="readonly-badge">🔒 Read-only</span>
  <div class="stats">
    Selected: <b id="selectedInfo">—</b> &nbsp;|&nbsp;
    Layer 1 links: <b id="linkCount0">0</b> &nbsp;|&nbsp;
    Layer 2 links: <b id="linkCount1">0</b>
  </div>
</div>

<div class="instructions">
  Click an <kbd>old</kbd> variable, then click a <kbd>new</kbd> variable to link them.
  Click a linked variable to unlink it.
  Links are saved in localStorage — you won't lose them on refresh.
</div>

<div class="search-bar">
  <input type="text" id="searchInput" placeholder="Filter variables by name..." oninput="applySearch()">
</div>

<div class="layer active" id="layer0"></div>
<div class="layer" id="layer1"></div>

<div class="export-overlay" id="exportOverlay" onclick="if(event.target===this)this.classList.remove('open')">
  <div class="export-box">
    <h3>All Links</h3>
    <textarea id="exportText" readonly></textarea>
    <div class="actions">
      <button class="secondary" onclick="document.getElementById('exportOverlay').classList.remove('open')">Close</button>
      <button onclick="navigator.clipboard.writeText(document.getElementById('exportText').value);this.textContent='Copied!';setTimeout(()=>this.textContent='Copy',1500)">Copy</button>
    </div>
  </div>
</div>

// --- Parse ---
function parseOldVars(collName) {
  const coll = OLD_DATA.collections.find(c => c.name === collName);
  if (!coll) return { modes: [], groups: {} };
  const m = coll.modes[0];
  const groups = {};
  for (const v of m.variables) {
    const top = v.name.split('/')[0];
    if (!groups[top]) groups[top] = [];
    let hex = null;
    if (v.isAlias) {
      hex = resolveOldAlias(v.value.collection, v.value.name);
    } else {
      hex = v.value;
    }
    groups[top].push({
      id: `old:${collName}:${v.name}`,
      name: v.name,
      shortName: v.name.split('/').slice(1).join('/') || v.name,
      hex,
      alias: v.isAlias ? v.value.name : null,
    });
  }
  return { modes: coll.modes.map(m => m.name), groups };
}

function resolveOldAlias(collName, varName) {
  const coll = OLD_DATA.collections.find(c => c.name === collName);
  if (!coll) return null;
  const v = coll.modes[0].variables.find(x => x.name === varName);
  if (!v) return null;
  if (v.isAlias) return resolveOldAlias(v.value.collection, v.value.name);
  return v.value;
}

function flattenTokens(obj, path = '') {
  let tokens = [];
  if (obj && typeof obj === 'object') {
    if ('$type' in obj) {
      const ext = obj.$extensions || {};
      tokens.push({
        path,
        hex: obj.$value?.hex || null,
        alpha: obj.$value?.alpha,
        alias: ext['com.figma.aliasData']?.targetVariableName || null,
      });
      return tokens;
    }
    for (const [k, v] of Object.entries(obj)) {
      tokens.push(...flattenTokens(v, path ? `${path}/${k}` : k));
    }
  }
  return tokens;
}

function groupNewTokens(tokens, prefix) {
  const groups = {};
  for (const t of tokens) {
    const top = t.path.split('/')[0];
    if (!groups[top]) groups[top] = [];
    groups[top].push({
      id: `new:${prefix}:${t.path}`,
      name: t.path,
      shortName: t.path.split('/').slice(1).join('/') || t.path,
      hex: t.hex,
      alpha: t.alpha,
      alias: t.alias,
    });
  }
  return groups;
}

}

// Fixed group order: shared groups first, then side-specific, consistent on both sides
const GROUP_ORDER_L0 = ['Gray', 'Red', 'Orange', 'Product Primary', 'Green', 'Product Secondary', 'Violet', 'Product Tertiary', 'Pink', 'Product Quaternary', 'Aqua', 'Blue'];
const GROUP_ORDER_L1 = ['Background', 'Fills', 'Neutral', 'Accent', 'Text', 'Success', 'Attention', 'Error', 'Stroke', 'Special', 'Additional', 'TV'];

function orderedKeys(groups, layer) {
  const order = layer === 0 ? GROUP_ORDER_L0 : GROUP_ORDER_L1;
  const keys = new Set(Object.keys(groups));
  const result = [];
  for (const g of order) { if (keys.has(g)) { result.push(g); keys.delete(g); } }
  for (const g of [...keys].sort()) result.push(g);
  return result;
}

// --- Render ---
function renderSwatchStyle(v) {
  if (!v.hex) return { cls: '', style: 'background:transparent;border-style:dashed', inner: '' };
  const a = v.alpha !== undefined && v.alpha !== null ? v.alpha : 1;
  if (a < 1) {
    return { cls: 'has-alpha', style: '', inner: `<div class="swatch-color" style="background:${v.hex};opacity:${a.toFixed(2)}"></div>` };
  }
  return { cls: '', style: `background:${v.hex}`, inner: '' };
}

function isDefaultLink(id, layer) {
  const dl = DEFAULT_LINKS[layer];
  if (!dl) return false;
  if (dl[id]) return true;
  return Object.values(dl).includes(id);
}

function renderVarItems(vars, side, layer) {
  let html = '';
  for (const v of vars) {
    const linked = isLinked(v.id, layer);
    const partner = getPartner(v.id, layer);
    const cls = linked ? 'linked' : '';
    const sw = renderSwatchStyle(v);
    const linkText = partner ? `→ ${partner}` : '';
    const aliasText = v.alias ? `↗ ${v.alias}` : '';
    const autoDot = linked && isDefaultLink(v.id, layer) ? '<span class="auto-dot" title="auto-mapped">●</span>' : '';
    html += `<div class="var-item ${cls}" data-id="${v.id}" data-side="${side}" data-layer="${layer}" onclick="handleClick(this)">
      <div class="swatch ${sw.cls}" style="${sw.style}">${sw.inner}</div>
      <span class="name" title="${v.name}">${v.shortName}</span>
      ${aliasText ? `<span class="alias-info">${aliasText}</span>` : ''}
      ${linkText ? `<span class="link-indicator">${linkText}${autoDot}</span>` : ''}
    </div>`;
  }
  return html;
}

function renderLayer(layerIdx) {
  const el = document.getElementById(`layer${layerIdx}`);
  // Remember collapsed groups before re-render
  const collapsed = new Set();
  el.querySelectorAll('.group-title.collapsed').forEach(t => collapsed.add(t.textContent.trim()));

  el.innerHTML = '';
  el.classList.remove('two-col');

  const oldGroups = layerIdx === 0 ? oldBase.groups : oldCtx.groups;
  const newGroups = layerIdx === 0 ? newProduct : newTheme;
  const oldLabel = layerIdx === 0 ? '.Base colors' : 'Context colors';
  const newLabel = layerIdx === 0 ? '.Product' : 'Theme';
  const oldInfo = layerIdx === 0 ? `${Object.values(oldBase.groups).flat().length} vars — ${oldBase.modes.join(', ')}` : `${Object.values(oldCtx.groups).flat().length} vars — Light, Dark, …`;
  const newInfo = layerIdx === 0 ? `${Object.values(newProduct).flat().length} vars — Blocker, DNS, Mail, …` : `${Object.values(newTheme).flat().length} vars — Light, Dark, …`;

  // Headers row
  const headers = document.createElement('div');
  headers.className = 'layer-headers';
  headers.innerHTML = `<div class="side-header old">${oldLabel} <span>(${oldInfo})</span></div><div class="side-header new">${newLabel} <span>(${newInfo})</span></div>`;
  el.append(headers);

  if (layerIdx === 1) {
    // Layer 2: two independent columns + SVG lines
    el.classList.add('two-col');
    const cols = document.createElement('div');
    cols.className = 'columns';
    const colOld = document.createElement('div');
    colOld.className = 'col col-old';
    const colNew = document.createElement('div');
    colNew.className = 'col col-new';

    for (const gName of orderedKeys(oldGroups, layerIdx)) {
      const box = document.createElement('div');
      box.className = 'group-box';
      box.innerHTML = `<div class="group-title" onclick="toggleGroup(this); requestAnimationFrame(drawLinks)"><span><span class="arrow">▾</span> ${gName}/</span><span class="cnt">${oldGroups[gName].length}</span></div><div class="group-body">${renderVarItems(oldGroups[gName], 'old', layerIdx)}</div>`;
      colOld.append(box);
    }
    for (const gName of orderedKeys(newGroups, layerIdx)) {
      const box = document.createElement('div');
      box.className = 'group-box';
      box.innerHTML = `<div class="group-title" onclick="toggleGroup(this); requestAnimationFrame(drawLinks)"><span><span class="arrow">▾</span> ${gName}/</span><span class="cnt">${newGroups[gName].length}</span></div><div class="group-body">${renderVarItems(newGroups[gName], 'new', layerIdx)}</div>`;
      colNew.append(box);
    }

    cols.append(colOld, colNew);
    el.append(cols);

    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.classList.add('link-svg');
    svg.id = 'linkSvg1';
    el.append(svg);
    restoreCollapsed(el, collapsed);
    applySearch();
    requestAnimationFrame(() => drawLinks(1));
    markLastLinked(el);
    return;
  }

  // Layer 0: paired groups (existing logic)
  const order = GROUP_ORDER_L0;
  const allOld = new Set(Object.keys(oldGroups));
  const allNew = new Set(Object.keys(newGroups));
  const allKeys = [];
  for (const g of order) { if (allOld.has(g) || allNew.has(g)) { allKeys.push(g); allOld.delete(g); allNew.delete(g); } }
  for (const g of [...allOld, ...allNew].sort()) { if (!allKeys.includes(g)) allKeys.push(g); }

  for (const gName of allKeys) {
    const pair = document.createElement('div');
    pair.className = 'group-pair';

    // Old side
    if (oldGroups[gName]) {
      const box = document.createElement('div');
      box.className = 'group-box';
      box.innerHTML = `<div class="group-title" onclick="toggleGroup(this); requestAnimationFrame(() => drawLinks(0))"><span><span class="arrow">▾</span> ${gName}/</span><span class="cnt">${oldGroups[gName].length}</span></div><div class="group-body">${renderVarItems(oldGroups[gName], 'old', layerIdx)}</div>`;
      pair.append(box);
    } else {
      pair.innerHTML += `<div class="group-box empty">no ${gName}/ in old</div>`;
    }

    // New side
    if (newGroups[gName]) {
      const box = document.createElement('div');
      box.className = 'group-box';
      box.innerHTML = `<div class="group-title" onclick="toggleGroup(this); requestAnimationFrame(() => drawLinks(0))"><span><span class="arrow">▾</span> ${gName}/</span><span class="cnt">${newGroups[gName].length}</span></div><div class="group-body">${renderVarItems(newGroups[gName], 'new', layerIdx)}</div>`;
      pair.append(box);
    } else {
      pair.innerHTML += `<div class="group-box empty">no ${gName}/ in new</div>`;
    }

    el.append(pair);
  }

  const svg0 = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg0.classList.add('link-svg');
  svg0.id = 'linkSvg0';
  el.append(svg0);
  restoreCollapsed(el, collapsed);
  applySearch();
  requestAnimationFrame(() => drawLinks(0));
  markLastLinked(el);
}

function restoreCollapsed(container, collapsed) {
  if (!collapsed.size) return;
  container.querySelectorAll('.group-title').forEach(t => {
    if (collapsed.has(t.textContent.trim())) {
      t.classList.add('collapsed');
      t.nextElementSibling.classList.add('hidden');
    }
  });
}

// --- Interactions ---

function handleClick(el) {
  if (READONLY) return;
  const id = el.dataset.id;
  const side = el.dataset.side;
  const layer = parseInt(el.dataset.layer);

  if (side === 'old' && isLinked(id, layer)) {
    unlinkById(id, layer);
    selected = null;
    document.getElementById('selectedInfo').textContent = '—';
    renderLayer(layer);
    return;
  }

  if (!selected || selected.layer !== layer) {
    clearSelection();
    selected = { id, side, layer };
    el.classList.add('selected');
    document.getElementById('selectedInfo').textContent = idToName(id);
    return;
  }

  if (selected.side === side) {
    clearSelection();
    selected = { id, side, layer };
    el.classList.add('selected');
    document.getElementById('selectedInfo').textContent = idToName(id);
    return;
  }

  const oldId = side === 'old' ? id : selected.id;
  const newId = side === 'new' ? id : selected.id;
  links[layer][oldId] = newId;
  lastLinkedOld = oldId;
  saveLinks();
  selected = null;
  document.getElementById('selectedInfo').textContent = '—';
  renderLayer(layer);
}

function isLinked(id, layer) {
  const l = links[layer];
  // Old side: check if this old id has a mapping
  if (l[id] !== undefined) return true;
  // New side: check if any old id maps to this new id
  return Object.values(l).includes(id);
}

function getPartner(id, layer) {
  const l = links[layer];
  // Old side
  if (l[id]) return idToName(l[id]);
  // New side: collect all old vars that map here
  const partners = Object.entries(l).filter(([, v]) => v === id).map(([k]) => idToName(k));
  if (partners.length > 0) return partners.join(', ');
  return null;
}

function unlinkById(id, layer) {
  const l = links[layer];
  if (l[id]) { delete l[id]; saveLinks(); return; }
  for (const [k, v] of Object.entries(l)) {
    if (v === id) { delete l[k]; saveLinks(); return; }
  }
}

function idToName(id) {
  return id.split(':').slice(2).join(':');
}

function clearSelection() {
  document.querySelectorAll('.var-item.selected').forEach(el => el.classList.remove('selected'));
}

function markLastLinked(container) {
  container.querySelectorAll('.var-item.last-linked').forEach(el => el.classList.remove('last-linked'));
  if (!lastLinkedOld) return;
  const el = container.querySelector(`.var-item.linked[data-side="old"][data-id="${CSS.escape(lastLinkedOld)}"]`);
  if (el) el.classList.add('last-linked');
}

function toggleGroup(el) {
  el.classList.toggle('collapsed');
  el.nextElementSibling.classList.toggle('hidden');
}

function switchTab(idx) {
  currentTab = idx;
  document.querySelectorAll('.tab').forEach((t, i) => t.classList.toggle('active', i === idx));
  document.querySelectorAll('.layer').forEach((l, i) => l.classList.toggle('active', i === idx));
  selected = null;
  document.getElementById('selectedInfo').textContent = '—';
  requestAnimationFrame(() => drawLinks(idx));
}

function drawLinks(layerIdx) {
  if (layerIdx === undefined) layerIdx = currentTab;
  const svg = document.getElementById(`linkSvg${layerIdx}`);
  if (!svg) return;
  const container = document.getElementById(`layer${layerIdx}`);
  const rect = container.getBoundingClientRect();
  svg.setAttribute('width', rect.width);
  svg.setAttribute('height', container.scrollHeight);
  svg.style.height = container.scrollHeight + 'px';
  svg.innerHTML = '';

  for (const [oldId, newId] of Object.entries(links[layerIdx])) {
    const oldEl = container.querySelector(`.var-item[data-id="${CSS.escape(oldId)}"]`);
    const newEl = container.querySelector(`.var-item[data-id="${CSS.escape(newId)}"]`);
    if (!oldEl || !newEl) continue;
    if (oldEl.closest('.group-body.hidden') || newEl.closest('.group-body.hidden')) continue;
    if (oldEl.classList.contains('dim') || newEl.classList.contains('dim')) continue;
    if (oldEl.classList.contains('search-hidden') || newEl.classList.contains('search-hidden')) continue;
    const oRect = oldEl.getBoundingClientRect();
    const nRect = newEl.getBoundingClientRect();
    if (oRect.width === 0 || nRect.width === 0) continue;
    const cRect = container.getBoundingClientRect();

    const x1 = oRect.right - cRect.left;
    const y1 = oRect.top + oRect.height / 2 - cRect.top + container.scrollTop;
    const x2 = nRect.left - cRect.left;
    const y2 = nRect.top + nRect.height / 2 - cRect.top + container.scrollTop;

    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    line.setAttribute('x1', x1); line.setAttribute('y1', y1);
    line.setAttribute('x2', x2); line.setAttribute('y2', y2);
    line.dataset.old = oldId; line.dataset.new = newId;
    svg.append(line);

    const c1 = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    c1.setAttribute('cx', x1); c1.setAttribute('cy', y1); c1.setAttribute('r', 2.5);
    c1.dataset.old = oldId; c1.dataset.new = newId;
    const c2 = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    c2.setAttribute('cx', x2); c2.setAttribute('cy', y2); c2.setAttribute('r', 2.5);
    c2.dataset.old = oldId; c2.dataset.new = newId;
    svg.append(c1, c2);
  }
}

function applySearch() {
  const q = document.getElementById('searchInput').value.toLowerCase().trim();
  document.querySelectorAll('.var-item').forEach(el => {
    if (!q) { el.classList.remove('search-hidden'); return; }
    const name = (el.getAttribute('title') || el.querySelector('.name').title || el.querySelector('.name').textContent).toLowerCase();
    const group = el.closest('.group-box')?.querySelector('.group-title')?.textContent?.toLowerCase() || '';
    el.classList.toggle('search-hidden', !name.includes(q) && !group.includes(q));
  });
  if (currentTab === 1) requestAnimationFrame(drawLinks);
}

window.addEventListener('scroll', () => { if (currentTab === 1) requestAnimationFrame(drawLinks); });
window.addEventListener('resize', () => { if (currentTab === 1) requestAnimationFrame(drawLinks); });

document.addEventListener('mouseenter', (e) => {
  const item = e.target.closest('.var-item');
  if (!item) return;
  const layer = parseInt(item.dataset.layer);
  const id = item.dataset.id;
  const side = item.dataset.side;
  const l = links[layer];
  const partnerIds = new Set();
  if (side === 'old' && l[id]) partnerIds.add(l[id]);
  if (side === 'new') { for (const [k, v] of Object.entries(l)) { if (v === id) partnerIds.add(k); } }
  if (partnerIds.size > 0) {
    const otherSide = side === 'old' ? 'new' : 'old';
    if (layer === 1) {
      const otherCol = document.querySelector(`.col-${otherSide}`);
      if (otherCol) otherCol.classList.add('sticky');
    }
    document.querySelectorAll(`.var-item[data-layer="${layer}"][data-side="${otherSide}"]`).forEach(el => {
      if (partnerIds.has(el.dataset.id)) el.classList.add('peer-highlight');
      else el.classList.add('dim');
    });
    requestAnimationFrame(() => drawLinks(layer));
  }
}, true);

document.addEventListener('mouseleave', (e) => {
  const item = e.target.closest('.var-item');
  if (!item) return;
  const layer = parseInt(item.dataset.layer);
  document.querySelectorAll('.var-item.dim, .var-item.peer-highlight').forEach(el => {
    el.classList.remove('dim', 'peer-highlight');
  });
  document.querySelectorAll('.col.sticky').forEach(el => el.classList.remove('sticky'));
  requestAnimationFrame(() => drawLinks(layer));
}, true);

function exportLinks() {
  const out = buildExport();
  navigator.clipboard.writeText(JSON.stringify(out, null, 2));
  const btn = event.target;
  btn.textContent = '✅ Copied!';
  setTimeout(() => btn.textContent = '📋 Copy Links JSON', 1500);
}

function showExport() {
  const out = buildExport();
  document.getElementById('exportText').value = JSON.stringify(out, null, 2);
  document.getElementById('exportOverlay').classList.add('open');
}

function buildExport() {
  const out = { layer1_primitives: {}, layer2_semantic: {} };
  for (const [oldId, newId] of Object.entries(links[0])) {
    out.layer1_primitives[idToName(oldId)] = idToName(newId);
  }
  for (const [oldId, newId] of Object.entries(links[1])) {
    out.layer2_semantic[idToName(oldId)] = idToName(newId);
  }
  return out;
}

function clearLinks() {
  if (!confirm('Clear ALL links on both layers?')) return;
  links = { 0: {}, 1: {} };
  saveLinks();
  renderLayer(0);
  renderLayer(1);
}

function resetToDefaults() {
  if (!confirm('Reset to pre-filled confident mappings? Your edits will be lost.')) return;
  links = JSON.parse(JSON.stringify(DEFAULT_LINKS));
  saveLinks();
  renderLayer(0);
  renderLayer(1);
}

// --- Init ---
if (READONLY) document.body.classList.add('readonly');
renderLayer(0);
renderLayer(1);
updateCounts();

document.addEventListener('keydown', (e) => {
  const input = document.getElementById('searchInput');
  if (e.target === input) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key.length === 1) { input.focus(); }
  if (e.key === 'Escape') { input.value = ''; applySearch(); input.blur(); }
});
</script>
